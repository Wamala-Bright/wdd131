<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Wamala Bright">
  <meta name="description" content="Browse and filter LDS temples by age and size.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | Temples</title>

  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/filtered-temples.js" defer></script>
</head>
<body>
<header>
  <img src="images/lds-logo.png" alt="Church of Jesus Christ of Latter-day Saints logo">
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="temples.html" class="active">Temples</a></li>
      <li><a href="form.html">Feedback</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>Browse Temples</h1>

  <!-- Filters -->
  <div class="filters">
    <button data-filter="all">All</button>
    <button data-filter="old">Old</button>
    <button data-filter="new">New</button>
    <button data-filter="large">Large</button>
    <button data-filter="small">Small</button>
  </div>

  <!-- Temple Container -->
  <section class="gallery" id="temples"></section>
</main>

<footer>
  <p>&copy; <span id="year"></span> Temple Album</p>
  <a href="references.html">References</a>
</footer>

</html>
