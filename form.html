<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <div class="form-container">
      <form id="reviewForm" method="get" action="review.html">

        <!-- Product Name -->
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Choose a Product ...</option>
        </select>

        <!-- Overall Rating -->
        <label>Overall Rating</label>
        <div class="rating">
          <label>☆<input type="radio" name="rating" value="1" required></label>
          <label>☆☆<input type="radio" name="rating" value="2"></label>
          <label>☆☆☆<input type="radio" name="rating" value="3"></label>
          <label>☆☆☆☆<input type="radio" name="rating" value="4"></label>
          <label>☆☆☆☆☆<input type="radio" name="rating" value="5"></label>
        </div>

        <!-- Date of Installation -->
        <label for="installationDate">Date of Installation</label>
        <input type="date" id="installationDate" name="installationDate" required>

        <!-- Useful Features -->
        <label>Which features did you find useful in the product?<br><small>(Check all that apply)</small></label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="features" value="Durability"> Durability</label>
          <label><input type="checkbox" name="features" value="Ease of Use"> Ease of Use</label>
          <label><input type="checkbox" name="features" value="Performance"> Performance</label>
          <label><input type="checkbox" name="features" value="Design"> Design</label>
        </div>

        <!-- Written Review -->
        <label for="review">Written Review <span class="optional">(Optional)</span></label>
        <textarea id="review" name="review" rows="4"></textarea>

        <!-- User Name -->
        <label for="userName">Your Name <span class="optional">(Optional)</span></label>
        <input type="text" id="userName" name="userName">

        <!-- Submit Button -->
        <input type="submit" value="Post Review">

      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 🐱‍👤 Wamala Bright 🐱‍👤</p>
    <p>Madagascar | Last Modified: 02/26/2024 13:56:10</p>
  </footer>
</body>
</html>
